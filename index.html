<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LAN Party Countdown</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="background-layer">
        <div class="fog fog-left"></div>
        <div class="fog fog-right"></div>
        <div class="particles"></div>
    </div>

    <div class="container">
        <div class="wood-corners">
            <div class="corner top-left"></div>
            <div class="corner top-right"></div>
            <div class="corner bottom-left"></div>
            <div class="corner bottom-right"></div>
        </div>

        <div class="title-wrapper">
            <div class="viking-emblem">
                <span class="rune-symbol"></span>
            </div>
            <h1 class="title" data-text="LAN PARTY 2026">
                <span class="title-main">LAN PARTY</span>
                <span class="title-year">2026 Q4</span>
            </h1>
            <div class="crossed-axes">
                <div class="viking-axe axe-left">
                    <div class="axe-handle"></div>
                    <div class="axe-head"></div>
                </div>
                <div class="viking-axe axe-right">
                    <div class="axe-handle"></div>
                    <div class="axe-head"></div>
                </div>
            </div>
        </div>

        <div class="countdown-container">
            <div class="countdown-box">
                <div class="time-value" id="days">00</div>
                <div class="time-label">DAYS</div>
                <div class="rune-line"></div>
            </div>
            <div class="separator"></div>
            <div class="countdown-box">
                <div class="time-value" id="hours">00</div>
                <div class="time-label">HOURS</div>
                <div class="rune-line"></div>
            </div>
            <div class="separator"></div>
            <div class="countdown-box">
                <div class="time-value" id="minutes">00</div>
                <div class="time-label">MINUTES</div>
                <div class="rune-line"></div>
            </div>
            <div class="separator"></div>
            <div class="countdown-box">
                <div class="time-value" id="seconds">00</div>
                <div class="time-label">SECONDS</div>
                <div class="rune-line"></div>
            </div>
        </div>

        <div class="event-info">
            <p class="event-date">
                <span class="date-icon">⚔</span>
                October 10, 2026 - 12:00
                <span class="date-icon">⚔</span>
            </p>
            <p class="tagline">SO IT BEGINS</p>
        </div>

        <div class="viking-elements">
            <div class="rune rune-left">ᚠ</div>
            <div class="rune rune-right">ᚱ</div>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
