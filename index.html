<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LAN Party Countdown</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="t8-root">
        <div class="t8-stars"></div>
        <div class="t8-hud">
            <div class="t8-topbar">
                <span>MISSION&nbsp;LAN-PARTY-26</span>
                <span class="t8-rec">&#9679;&nbsp;REC</span>
                <span>FLIGHT DIR:&nbsp;<b>GO</b></span>
            </div>
            <div class="t8-orbit">
                <div class="t8-ring"></div>
                <div class="t8-ring t8-ring2"></div>
                <div class="t8-planet"></div>
                <div class="t8-sat"></div>
            </div>
            <div class="t8-tminus">T&nbsp;&minus;&nbsp;MINUS</div>
            <div class="t8-readout">
                <div class="t8-seg"><span class="t8-num" data-field="days">00</span><span class="t8-lbl">DAYS</span></div>
                <div class="t8-seg"><span class="t8-num" data-field="hours">00</span><span class="t8-lbl">HRS</span></div>
                <div class="t8-seg"><span class="t8-num" data-field="minutes">00</span><span class="t8-lbl">MIN</span></div>
                <div class="t8-seg"><span class="t8-num" data-field="seconds">00</span><span class="t8-lbl">SEC</span></div>
            </div>
            <div class="t8-window">
                <span class="t8-wkey">LAUNCH WINDOW</span>
                <span class="t8-wval">OCT 10, 2026 &nbsp;&middot;&nbsp; 12:00 EEST &nbsp;&middot;&nbsp; Q3 LAN</span>
            </div>
            <div class="t8-telemetry">
                <span>ALT&nbsp;000.0&nbsp;KM</span>
                <span>VEL&nbsp;0000&nbsp;M/S</span>
                <span>FUEL&nbsp;100%</span>
                <span>ALL SYS&nbsp;<b>NOMINAL</b></span>
            </div>
            <div class="t8-ended" data-ended>&#9664; LIFTOFF &mdash; WE HAVE LIFTOFF &#9658;</div>
        </div>
    </div>
    <script src="script.js"></script>
</body>
</html>
